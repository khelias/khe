name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  links:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore lychee cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Lychee link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --no-progress
            --cache
            --max-cache-age 1d
            --max-concurrency 5
            --retry-wait-time 2
            --max-retries 2
            --exclude '^https://medium\.com/'
            --exclude '^https://(www\.)?(twitter|x)\.com/'
            --exclude '^https://(www\.)?linkedin\.com/'
            './**/*.md'
          fail: true

  workspace:
    name: Workspace manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Parse repos.yaml and check every entry has a name and URL
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/workspace.sh
          out=$(scripts/workspace.sh status)
          echo "$out"
          listed=$(grep -c '^  - name:' repos/repos.yaml)
          parsed=$(echo "$out" | grep -c '(not cloned)')
          urls=$(grep -cE '^    url: https://' repos/repos.yaml)
          if [ "$listed" -ne "$parsed" ] || [ "$listed" -ne "$urls" ]; then
            echo "FAIL: $listed entries, $parsed parsed, $urls with an https url"
            exit 1
          fi
          echo "OK: $listed repos in the manifest."
